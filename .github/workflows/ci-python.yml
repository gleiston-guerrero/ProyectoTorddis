name: ci-python

on:
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - 'src/backend/**'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main]

jobs:
  # The statistical notebooks run on a current Python; they share no
  # dependency with the back-end.
  test-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install analysis dependencies
        working-directory: analysis
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert

      - name: Execute analysis notebooks
        working-directory: analysis
        run: |
          for nb in *.ipynb; do
            jupyter nbconvert --to notebook --execute --inplace "$nb" || exit 1
          done

  # The back-end is pinned to Python 3.9: TensorFlow 2.8.0 and psycopg2 2.8.6
  # publish no wheels for 3.10 or 3.11, so requirements.txt cannot be
  # installed on a newer interpreter.
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install back-end dependencies
        working-directory: src/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify that the recognition stack imports
        working-directory: src/backend
        run: |
          python -c "import tensorflow, mediapipe, cv2, imutils; print('recognition stack OK')"

      - name: Run Django unit tests
        working-directory: src/backend
        run: |
          python manage.py test Persona Monitoreo --settings=WebServicesTorddis.settings_test